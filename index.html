/* Hidden three-tap eye easter egg */
.secret-eye-hit{position:absolute;z-index:4;left:30%;top:36%;width:40%;height:14%;border:0;background:transparent;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.secret-eye-hit:focus-visible{outline:2px dashed var(--red);outline-offset:3px}
.secret-fx{position:fixed;inset:0;z-index:10001;overflow:hidden;pointer-events:none;isolation:isolate}
.secret-burst{position:fixed;display:block;pointer-events:none;user-select:none}

.secret-burst{left:var(--fx-x);top:var(--fx-y);width:clamp(170px,26vw,380px);height:auto;opacity:0;animation:secret-burst-expand 1.2s cubic-bezier(.2,.7,.2,1) both}
.secret-page{position:fixed;inset:0;z-index:10000;display:grid;place-items:start center;background:var(--paper);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s linear;overflow:hidden}
.secret-page.revealed{opacity:1;visibility:visible;pointer-events:auto}
.secret-home{width:clamp(190px,28vw,390px);margin-top:clamp(28px,5vh,64px);border:0;background:transparent;padding:0;cursor:pointer;opacity:0;transform:translateY(-10px);transition:opacity .3s .38s ease,transform .3s .38s ease}
.secret-page.revealed .secret-home{opacity:1;transform:none}
.secret-home img{display:block;width:100%;height:auto}
.secret-page{grid-template-rows:auto auto 1fr;row-gap:0}.secret-heading{margin:clamp(14px,2.4vh,30px) 0 0;font-family:'Rock Salt',cursive;font-weight:400;font-size:clamp(15px,2vw,26px);letter-spacing:.06em;color:var(--ink);text-align:center;opacity:0;transform:translateY(-8px);transition:opacity .3s .46s ease,transform .3s .46s ease}.secret-page.revealed .secret-heading{opacity:1;transform:none}
@keyframes secret-burst-expand{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.05) rotate(0deg)}
  8%{opacity:1}
  70%{opacity:1;transform:translate(-50%,-50%) scale(4.5) rotate(410deg)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(12) rotate(760deg)}
}
@media (prefers-reduced-motion:reduce){
  .secret-burst{animation-duration:.34s}
  .secret-page{transition:none}
  .secret-home,.secret-heading{transition:none}
}
@media print{.secret-eye-hit,.secret-fx,.secret-page{display:none!important}}
