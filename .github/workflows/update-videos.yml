# Yes Boone - keeps videos.json up to date with the newest long-form YouTube videos (no Shorts).
# Runs every hour on GitHub (free). If YouTube can't be read, nothing changes and the site
# keeps showing the last good list.
# EDIT ME (inside the script below):
#   HIDE_IDS    = video IDs to never show, e.g. ['abcdefghijk']
#   ALWAYS_SHOW = video IDs to always put first, e.g. a video posted on another channel
#   MAX_VIDEOS  = how many video cards the site shows
name: Update latest videos

on:
  schedule:
    - cron: '17 * * * *'   # every hour, at 17 minutes past
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the YouTube videos
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const CHANNEL_ID = 'UCt0bc5uqdaC0bcihYZZbytw';   // youtube.com/@yesboone
          const MAX_VIDEOS = 5;
          const HIDE_IDS = [];
          const ALWAYS_SHOW = [];
          const MANUAL = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch';
          const HEADERS = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36',
            'Accept-Language': 'en-AU,en;q=0.9',
            'Cookie': 'SOCS=CAI; CONSENT=YES+1',
          };
          const ID = /^[\w-]{11}$/;
          const decode = (t) => t.replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16)))
            .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d)).replace(/&quot;/g, '"').replace(/&apos;/g, "'")
            .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
          const pick = (t, re) => { const m = t.match(re); return m ? m[1].trim() : ''; };

          // Source 1: YouTube's long-form feed (UULF = videos only, no Shorts).
          async function fromFeed() {
            const res = await fetch('https://www.youtube.com/feeds/videos.xml?playlist_id=UULF' + CHANNEL_ID.slice(2), { headers: HEADERS });
            if (!res.ok) throw new Error('feed HTTP ' + res.status);
            const list = (await res.text()).match(/<entry\b[^>]*>[\s\S]*?<\/entry>/g) || [];
            return list.map((e) => ({
              id: pick(e, /<yt:videoId>([\w-]{11})<\/yt:videoId>/),
              title: decode(pick(e, /<title>([\s\S]*?)<\/title>/)),
              published: pick(e, /<published>([^<]+)<\/published>/),
              link: pick(e, /<link\b[^>]*\bhref="([^"]+)"/),
            })).filter((v) => !v.link.includes('/shorts/'))
              .sort((a, b) => Date.parse(b.published || 0) - Date.parse(a.published || 0));
          }

          // Source 2: the channel's "Videos" tab (long-form only - Shorts live on a separate tab), newest first.
          async function fromVideosTab() {
            const res = await fetch('https://www.youtube.com/channel/' + CHANNEL_ID + '/videos?hl=en&gl=AU', { headers: HEADERS });
            if (!res.ok) throw new Error('videos tab HTTP ' + res.status);
            const html = await res.text();
            const out = [];
            const seen = new Set();
            const add = (id, title) => { if (ID.test(id) && !seen.has(id)) { seen.add(id); out.push({ id, title: title || '' }); } };
            // Classic layout: "videoRenderer":{"videoId":"...", ... "title":{"runs":[{"text":"..."}]
            for (const m of html.matchAll(/"videoRenderer":\{"videoId":"([\w-]{11})"[\s\S]{0,4000}?"title":\{"runs":\[\{"text":"((?:[^"\\]|\\.)*)"/g)) add(m[1], JSON.parse('"' + m[2] + '"'));
            // Newer layout: "lockupViewModel" with "contentId" (skip Shorts layouts)
            if (!out.length) for (const m of html.matchAll(/"lockupViewModel":\{[\s\S]{0,3000}?"contentId":"([\w-]{11})"[\s\S]{0,3000}?"title":\{"content":"((?:[^"\\]|\\.)*)"/g)) add(m[1], JSON.parse('"' + m[2] + '"'));
            if (!out.length && /consent\.youtube\.com|before you continue/i.test(html)) throw new Error('videos tab showed a consent page');
            return out;
          }

          let videos = [];
          const problems = [];
          for (const [name, source] of [['long-form feed', fromFeed], ['Videos tab', fromVideosTab]]) {
            for (let attempt = 1; attempt <= 2 && !videos.length; attempt++) {
              try {
                videos = (await source()).filter((v) => v.id && !HIDE_IDS.includes(v.id));
                if (!videos.length) throw new Error('no videos found');
                console.log(`Read ${videos.length} videos from the ${name}`);
              } catch (err) {
                problems.push(`${name} (try ${attempt}): ${err.message}`);
                console.log(`Could not read the ${name} (try ${attempt}): ${err.message}`);
                await new Promise((r) => setTimeout(r, 4000));
              }
            }
            if (videos.length) break;
          }
          if (!videos.length) {
            const msg = "Couldn't read YouTube - the site keeps its current videos. " + problems.join(' | ');
            console.log(`::${MANUAL ? 'error' : 'warning'}::${msg}`);
            process.exit(MANUAL ? 1 : 0);   // red cross only when you press Run workflow; hourly runs stay quiet
          }
          const pinned = ALWAYS_SHOW.filter((id) => ID.test(id)).map((id) => videos.find((v) => v.id === id) || { id, title: '' });
          const list = [...pinned, ...videos.filter((v) => !ALWAYS_SHOW.includes(v.id))]
            .slice(0, MAX_VIDEOS).map(({ id, title, published }) => ({ id, title, ...(published ? { published } : {}) }));
          let old = null;
          try { old = JSON.parse(fs.readFileSync('videos.json', 'utf8')); } catch {}
          if (old && JSON.stringify(old.videos) === JSON.stringify(list)) { console.log('No new videos'); process.exit(0); }
          fs.writeFileSync('videos.json', JSON.stringify({ videos: list, updated: new Date().toISOString() }, null, 1) + '\n');
          console.log('Saved: ' + list.map((v) => v.title || v.id).join(' | '));
          EOF

      - name: Save to the repo (only if the list changed)
        run: |
          if [ -z "$(git status --porcelain -- videos.json)" ]; then echo "Nothing to save"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Update latest videos"
          git push
