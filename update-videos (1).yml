# Yes Boone - keeps videos.json up to date with the newest long-form YouTube videos (no Shorts).
# Uses the official YouTube Data API with a free key saved in GitHub as the secret YT_API_KEY.
# Runs every hour on GitHub (free). If YouTube can't be read, nothing changes and the site
# keeps showing the last good list.
# EDIT ME (inside the script below):
#   HIDE_IDS    = video IDs to never show, e.g. ['abcdefghijk']
#   ALWAYS_SHOW = video IDs to always put first, e.g. a video posted on another channel
#   MAX_VIDEOS  = how many video cards the site shows
name: Update latest videos

on:
  schedule:
    - cron: '17 * * * *'   # every hour, at 17 minutes past
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the YouTube videos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const CHANNEL_ID = 'UCt0bc5uqdaC0bcihYZZbytw';   // youtube.com/@yesboone
          const MAX_VIDEOS = 5;
          const HIDE_IDS = [];
          const ALWAYS_SHOW = [];
          const KEY = (process.env.YT_API_KEY || '').trim();
          const MANUAL = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch';
          const ID = /^[\w-]{11}$/;
          const API = 'https://www.googleapis.com/youtube/v3/';

          function stop(msg) {
            console.log(`::${MANUAL ? 'error' : 'warning'}::${msg}`);
            process.exit(MANUAL ? 1 : 0);   // red cross only when you press Run workflow; hourly runs stay quiet
          }
          if (!KEY) stop('No YouTube key found. Add it in Settings > Secrets and variables > Actions as YT_API_KEY.');

          async function api(path, params) {
            const url = API + path + '?' + new URLSearchParams({ ...params, key: KEY });
            const res = await fetch(url);
            const body = await res.json().catch(() => ({}));
            if (!res.ok) {
              const e = new Error(`YouTube said ${res.status}: ${body?.error?.message || res.statusText}`);
              e.status = res.status;
              throw e;
            }
            return body;
          }
          const items = async (playlistId) => (await api('playlistItems', { part: 'snippet,contentDetails', playlistId, maxResults: '50' })).items || [];
          const seconds = (d) => { const m = /P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(d || '') || []; return (+m[1] || 0) * 86400 + (+m[2] || 0) * 3600 + (+m[3] || 0) * 60 + (+m[4] || 0); };

          let raw = [];
          let shortsSafe = true;
          try {
            // Long-form uploads only (YouTube keeps Shorts out of this list).
            raw = await items('UULF' + CHANNEL_ID.slice(2));
            console.log(`Long-form list: ${raw.length} videos`);
          } catch (err) {
            if (err.status === 400 || err.status === 403) stop(err.message + ' - check the key is right and the YouTube Data API v3 is turned on.');
            console.log('Long-form list not available (' + err.message + '), using all uploads instead');
          }
          if (!raw.length) {
            try { raw = await items('UU' + CHANNEL_ID.slice(2)); shortsSafe = false; console.log(`All uploads: ${raw.length} videos`); }
            catch (err) { stop("Couldn't read YouTube - the site keeps its current videos. " + err.message); }
          }

          let videos = raw.map((it) => ({
            id: it.contentDetails?.videoId || it.snippet?.resourceId?.videoId || '',
            title: it.snippet?.title || '',
            published: it.contentDetails?.videoPublishedAt || it.snippet?.publishedAt || '',
            text: (it.snippet?.title || '') + ' ' + (it.snippet?.description || ''),
          })).filter((v) => ID.test(v.id) && !HIDE_IDS.includes(v.id) && v.title !== 'Private video' && v.title !== 'Deleted video');

          if (!shortsSafe && videos.length) {
            // Mixed list: drop anything that looks like a Short (60 seconds or less, or tagged #shorts).
            const info = await api('videos', { part: 'contentDetails', id: videos.map((v) => v.id).join(',') }).catch(() => ({ items: [] }));
            const len = new Map((info.items || []).map((x) => [x.id, seconds(x.contentDetails?.duration)]));
            videos = videos.filter((v) => !/#shorts?\b/i.test(v.text) && (len.get(v.id) ?? 999) > 60);
          }
          videos.sort((a, b) => Date.parse(b.published || 0) - Date.parse(a.published || 0));
          if (!videos.length) stop('YouTube returned no public videos - the site keeps its current videos.');

          const pinned = ALWAYS_SHOW.filter((id) => ID.test(id)).map((id) => videos.find((v) => v.id === id) || { id, title: '' });
          const list = [...pinned, ...videos.filter((v) => !ALWAYS_SHOW.includes(v.id))]
            .slice(0, MAX_VIDEOS).map(({ id, title, published }) => ({ id, title, ...(published ? { published } : {}) }));
          let old = null;
          try { old = JSON.parse(fs.readFileSync('videos.json', 'utf8')); } catch {}
          if (old && JSON.stringify(old.videos) === JSON.stringify(list)) { console.log('No new videos'); process.exit(0); }
          fs.writeFileSync('videos.json', JSON.stringify({ videos: list, updated: new Date().toISOString() }, null, 1) + '\n');
          console.log('Saved: ' + list.map((v) => v.title || v.id).join(' | '));
          EOF

      - name: Save to the repo (only if the list changed)
        run: |
          if [ -z "$(git status --porcelain -- videos.json)" ]; then echo "Nothing to save"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Update latest videos"
          git push
